    get:
      x-sdkwork-owner: sdkwork-agents
      x-sdkwork-api-authority: sdkwork-agents-app-api
      tags:
      - ai
      summary: List the authenticated owner's current Session activity snapshot
      description: >-
        Returns a bounded, newest-first current-state projection. A null cursor
        starts a fresh head snapshot; nextCursor is only continuation within that
        traversal and is not a durable change-feed watermark. Native runtime
        activity is opportunistically enriched for returned rows and remains
        authoritative only until providerActivity.freshUntil. The authenticated
        owner's Session user-state is included and participates in activityAt.
      operationId: agents.sessionActivitySummaries.list
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.sessionActivitySummaries
      x-sdkwork-permission: ai.agents.read
      x-sdkwork-tenant-scope: organization
      x-sdkwork-pagination-mode: cursor
      x-sdkwork-performance-class: P1
      parameters:
      - name: cursor
        in: query
        required: false
        description: Opaque continuation token bound to the authenticated owner and all filters.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^workspace\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^project\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$
      responses:
        '200':
          description: Current Session activity snapshot page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActivitySummaryListResponse'
        default:
          $ref: '#/components/responses/Problem'
