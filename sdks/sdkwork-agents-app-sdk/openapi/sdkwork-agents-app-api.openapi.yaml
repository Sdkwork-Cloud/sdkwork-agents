        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SdkWorkResourceData'
                - type: object
                  required: [item]
                  properties:
                    item:
                      $ref: '#/components/schemas/AgentProviderBindingRecord'
    AgentProviderBindingListResponse:
