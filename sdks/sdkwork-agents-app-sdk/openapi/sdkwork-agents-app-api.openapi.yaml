components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExpectedVersion:
      name: expected_version
      in: query
      required: false
      description: Optimistic concurrency version in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    RequestedAt:
      name: requested_at
      in: query
      required: true
      description: RFC3339 mutation timestamp.
      schema:
        type: string
        format: date-time
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'

    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^slot\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: validation_error
                errorCategory: validation
                retryable: false
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
            NotFound:
              summary: Resource not found
              value:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
