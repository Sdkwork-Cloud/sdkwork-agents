    CodeEngineCatalogListResponse:
      description: Code engine catalog response following SdkWorkApiResponse envelope;
        the catalog is returned as a single composite resource under data.item.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            allOf:
            - $ref: '#/components/schemas/SdkWorkResourceData'
            - type: object
              required:
              - item
              properties:
                item:
                  $ref: '#/components/schemas/CodeEngineCatalog'
    CodeEngineCatalog:
      type: object
      additionalProperties: false
      required:
      - engines
      properties:
        engines:
          type: array
          items:
            $ref: '#/components/schemas/CodeEngineCatalogEngine'
    CodeEngineCatalogEngine:
      type: object
      additionalProperties: false
      required:
      - engineKey
      - agentId
      - bindingId
      - models
      properties:
        engineKey:
          type: string
        agentId:
          type: string
        bindingId:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/CodeEngineModelCatalogEntry'
    CodeEngineModelCatalogEntry:
      type: object
      additionalProperties: false
      required:
      - engineKey
      - modelId
      - label
      - description
      - providerId
      - bindingId
      - defaultForEngine
      properties:
        engineKey:
          type: string
        modelId:
          type: string
        label:
          type: string
        description:
          type: string
        providerId:
          type: string
        bindingId:
          type: string
        defaultForEngine:
          type: boolean
    McpServerMarketplaceListResponse:
      description: MCP server marketplace list response following SdkWorkApiResponse
        envelope.
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            allOf:
            - $ref: '#/components/schemas/SdkWorkPageData'
            - type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/McpServerMarketplaceRecord'
    McpServerMarketplaceRecord:
      type: object
      additionalProperties: false
      required:
      - agentId
      - slotId
      - serverId
      - targetModule
      - targetRef
      - enabled
      - priority
      properties:
        agentId:
          type: string
        slotId:
          type: string
        serverId:
          type: string
        targetModule:
          type: string
        targetRef:
          type: string
        targetVersionRef:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
          format: int32
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: JSON Pointer or dot-path to the invalid field, for example
            `/agentId` or `data.item.code`.
        message:
          type: string
          description: Safe validation message for logs and optional UI display. MUST
            NOT reveal secrets or enumeration hints.
        code:
          type: integer
          format: int32
          minimum: 40011
          maximum: 40099
          description: Optional field-level validation subcode when ProblemDetail.code
            is 40001 VALIDATION_ERROR.
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: integer
          format: int32
          description: Numeric error result code. MUST be non-zero. See API_SPEC.md
            搂15.3.
          minimum: 40001
          maximum: 79999
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id. Same semantics as SdkWorkApiResponse.traceId.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
