      additionalProperties: false
      required: [tenantId, agentId, executionId, operation, status, inputPayload, outputPayload, requestedAt, completedAt]
      properties:
        tenantId:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        executionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^execution\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        operation:
          type: string
          enum: [preview_response, prompt_optimization]
        status:
          type: string
          enum: [completed]
        inputPayload:
          type: object
          additionalProperties: true
        outputPayload:
          type: object
          additionalProperties: true
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    AgentRuntimeExecutionResponse:
      description: Single agent runtime execution response following SdkWorkApiResponse envelope.
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SdkWorkResourceData'
                - type: object
                  required: [item]
                  properties:
                    item:
                      $ref: '#/components/schemas/AgentRuntimeExecutionRecord'

    AgentCompositionSlotKind:
      type: string
      enum: [memory, knowledge, skill, prompt, drive, tool]
    AgentCompositionTargetModule:
      type: string
      enum: [memory, knowledgebase, skills, prompts, drive]
    AgentCompositionSlotRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - organizationId
        - agentId
        - slotId
        - slotKind
        - targetModule
        - targetRef
        - priority
        - enabled
        - policyJson
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        tenantId:
          $ref: '#/components/schemas/Int64String'
        organizationId:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
