components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    StreamQuery:
      name: stream
      in: query
      required: false
      description: When true, returns text/event-stream with one completion event instead of JSON.
      schema:
        type: boolean
        default: false
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ListScope:
      name: scope
      in: query
      required: false
      description: >-
        List scope. Use `market`, `public`, or `published` for tenant-visible catalog agents;
        omit for agents owned by the authenticated user.
      schema:
        type: string
        enum: [market, public, published, mine, workspace]
    ExpectedVersion:
      name: expected_version
      in: query
      required: false
      description: Optimistic concurrency version in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    RequestedAt:
      name: requested_at
      in: query
      required: true
      description: RFC3339 mutation timestamp.
      schema:
        type: string
        format: date-time
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'

    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^slot\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^session\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^msg\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: 40001
                errorCategory: validation
                retryable: false
                traceId: '00000000-0000-0000-0000-000000000000'
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: 40901
                errorCategory: concurrency
                retryable: true
                traceId: '00000000-0000-0000-0000-000000000000'
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: 40301
                errorCategory: permission
                retryable: false
                traceId: '00000000-0000-0000-0000-000000000000'
            NotFound:
              summary: Resource not found
              value:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: 40401
                errorCategory: resource
                retryable: false
                traceId: '00000000-0000-0000-0000-000000000000'
  schemas:
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          format: int32
          description: Numeric success result code. MUST be 0 on HTTP 2xx JSON bodies. See API_SPEC.md §15.3.
          enum: [0]
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload. Typed per operation through allOf or explicit schema refs.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id. Clients MUST NOT supply this value.
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          description: Typed domain resource for the operation.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SdkWorkCommandData:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
        resourceId:
          type: string
        status:
          type: string
    SdkWorkAsyncData:
      type: object
      additionalProperties: false
      required: [accepted, operationId, status]
      properties:
        accepted:
          type: boolean
          const: true
        operationId:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        pollUrl:
          type: string
          format: uri-reference
    Int64String:
      type: string
      pattern: '^[0-9]+$'
    AgentStatus:
      type: string
      enum: [draft, active, disabled, archived, deleted]
    AgentVisibility:
      type: string
      enum: [private, organization, tenant, public]
    AgentImplementationKind:
      type: string
      enum: [manifest-only, typed-local-provider, process-adapter, protocol-adapter]
    AgentImplementationType:
      type: string
      enum: [sdkwork-native, rig-rust, openai-agents, langchain, langgraph, crewai, autogen, semantic-kernel, custom]
    PageInfo:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [offset, cursor]
          description: Pagination mode used by the response.
        page:
          type: integer
          minimum: 1
          description: Current page number when mode is offset.
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          description: Page size used by the response.
        totalItems:
          $ref: '#/components/schemas/Int64String'
        totalPages:
          type: integer
          minimum: 0
          description: Total pages when mode is offset.
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page when mode is cursor.
        hasMore:
          type: boolean
          description: Whether more pages follow the current page.
    AgentRecord:
      type: object
      additionalProperties: false
      required: [id, agentId, tenantId, organizationId, ownerUserId, code, displayName, manifest, implementationType, status, visibility, tags, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        tenantId:
          $ref: '#/components/schemas/Int64String'
        organizationId:
          $ref: '#/components/schemas/Int64String'
        ownerUserId:
          $ref: '#/components/schemas/Int64String'
        code:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 4096
        manifest:
          type: object
          additionalProperties: true
        defaultCodeTaskIntent:
          type: [object, 'null']
          additionalProperties: true
        managementProfile:
          oneOf:
            - $ref: '#/components/schemas/AgentManagementProfile'
            - type: 'null'
        implementationProviderId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^provider\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        implementationKind:
          oneOf:
            - $ref: '#/components/schemas/AgentImplementationKind'
            - type: 'null'
        implementationType:
          $ref: '#/components/schemas/AgentImplementationType'
        status:
          $ref: '#/components/schemas/AgentStatus'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 64
        version:
          $ref: '#/components/schemas/Int64String'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
    AgentManagementProfile:
      type: object
      additionalProperties: false
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 128
        avatar:
          type: string
          minLength: 1
          maxLength: 512
        categoryId:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          minLength: 1
          maxLength: 32
        debugMode:
          type: boolean
        iconName:
          type: string
          minLength: 1
          maxLength: 64
        jsonMode:
          type: boolean
        knowledgeBaseIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^knowledge\.base\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
          maxItems: 128
        memoryEnabled:
          type: boolean
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^model\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        skillIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^skill\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
          maxItems: 128
        suggestedPrompts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
          maxItems: 12
        systemPrompt:
          type: string
          minLength: 1
          maxLength: 32768
        temperature:
          type: number
          minimum: 0
          maximum: 2
        toolIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^tool\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
          maxItems: 128
        type:
          type: string
          enum: [normal, independent]
        users:
          type: string
          minLength: 1
          maxLength: 128
        voiceIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^voice\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
          maxItems: 16
        welcomeMessage:
          type: string
          minLength: 1
          maxLength: 4096
    AgentResponse:
      description: Single managed agent response following SdkWorkApiResponse envelope.
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SdkWorkResourceData'
                - type: object
                  required: [item]
                  properties:
                    item:
                      $ref: '#/components/schemas/AgentRecord'
    AgentListResponse:
      description: Paginated managed agent list response following SdkWorkApiResponse envelope.
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SdkWorkPageData'
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AgentRecord'
    AgentProviderBindingRecord:
      type: object
      additionalProperties: false
      required: [tenantId, agentId, bindingId, providerId, implementationKind, configurationProfileId, capabilities, active, version, createdAt, updatedAt]
      properties:
        tenantId:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        bindingId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        providerId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^provider\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        implementationKind:
          $ref: '#/components/schemas/AgentImplementationKind'
        configurationProfileId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^profile\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$'
          maxItems: 128
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Int64String'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentProviderBindingResponse:
      description: Single agent provider binding response following SdkWorkApiResponse envelope.
