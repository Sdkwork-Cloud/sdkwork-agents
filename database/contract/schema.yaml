schema_version: 1
kind: sdkwork.database.schema
module_id: agents
contract_version: 4.0.0
owner_team: agents-platform
compliance_level: L2
engines:
  - postgres
table_prefix: ai_
# Composition-plane architecture:
# - Core agent lifecycle tables owned by this module
# - MCP, knowledge, memory, skills, prompts, drive content owned by sibling modules
# - Cross-module references via ai_agent_composition_slot
tables:
  - name: ai_agent
    lifecycle_status: active
    owner: agents-platform
    description: 'Agent business entity with identity, manifest snapshot, and lifecycle state'
  - name: ai_agent_runtime_binding
    lifecycle_status: active
    owner: agents-platform
    description: 'Maps agents to provider runtime configurations with capability declarations'
  - name: ai_agent_composition_slot
    lifecycle_status: active
    owner: agents-platform
    description: 'Binds agents to sibling module resources (memory, knowledge, skills, prompts, drive, mcp)'
  - name: ai_agent_audit_event
    lifecycle_status: active
    owner: agents-platform
    description: 'Immutable audit log for agent management operations'
  - name: ai_agent_session
    lifecycle_status: active
    owner: agents-platform
    description: 'Hosted chat sessions scoped by tenant, agent, and owner'
  - name: ai_agent_message
    lifecycle_status: active
    owner: agents-platform
    description: 'Session messages and chat turn persistence'
  - name: ai_agent_interaction
    lifecycle_status: active
    owner: agents-platform
    description: 'Live interaction state for code-engine approval and user-question flows'
  - name: ai_agent_task
    lifecycle_status: active
    owner: agents-platform
    description: 'Scheduled agent tasks projected from kernel AgentTask'
  - name: ai_agent_project
    lifecycle_status: active
    owner: agents-platform
    description: 'Agents chat project identity, lifecycle, ownership, and access policy'
  - name: ai_agent_project_composition_slot
    lifecycle_status: active
    owner: agents-platform
    description: 'Project-scoped references to sibling-owned resources'
  - name: ai_agent_chat_turn
    lifecycle_status: active
    owner: agents-platform
    description: 'Idempotent inference command lifecycle, usage, error, and trace correlation'
  - name: ai_agent_message_drive_ref
    lifecycle_status: active
    owner: agents-platform
    description: 'Typed message relation to Drive-backed MediaResource values'
  - name: ai_agent_message_feedback
    lifecycle_status: active
    owner: agents-platform
    description: 'Per-user assistant message quality feedback'
  - name: ai_agent_resource_user_state
    lifecycle_status: active
    owner: agents-platform
    description: 'Per-user pinned, hidden, opened, read, and custom-title state'
  - name: ai_agent_project_member
    lifecycle_status: active
    owner: agents-platform
    description: 'Agents project collaboration ACL; not IM membership'
  - name: ai_agent_share_link
    lifecycle_status: active
    owner: agents-platform
    description: 'Hashed, revocable, expiring Agents project/session grants'
  - name: ai_agent_outbox_event
    lifecycle_status: active
    owner: agents-platform
    description: 'Reliable Agents aggregate event publication'
# Cross-module references (owned by other modules):
# - ai_agent_composition_slot.slot_kind IN ('memory') → sdkwork-memory
# - ai_agent_composition_slot.slot_kind IN ('knowledge') → sdkwork-knowledgebase
# - ai_agent_composition_slot.slot_kind IN ('skill') → sdkwork-skills
# - ai_agent_composition_slot.slot_kind IN ('prompt') → sdkwork-prompts
# - ai_agent_composition_slot.slot_kind IN ('drive') → sdkwork-drive
# - ai_agent_composition_slot.slot_kind IN ('mcp') → sdkwork-mcp
