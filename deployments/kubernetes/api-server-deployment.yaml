apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-agents-api-server
  labels:
    app.kubernetes.io/name: sdkwork-agents
    app.kubernetes.io/component: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agents
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agents
        app.kubernetes.io/component: api-server
    spec:
      containers:
        - name: api-server
          image: sdkwork-agents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: sdkwork-agents-config
            - secretRef:
                name: sdkwork-agents-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
