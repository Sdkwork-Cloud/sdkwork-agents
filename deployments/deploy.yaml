version: 1
defaultProfile: cloud.split-services.production

profiles:
  cloud.split-services.production:
    install:
      layout: binary-package
    expose:
      - domain: agents.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: agents-admin.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agent.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agents-app.sdkwork.com
        tls: sdkwork.com
        mode: api
    packages: []
    overrides: {}

  standalone.unified-process.production:
    install:
      layout: binary-package
    expose:
      - domain: agents.local.sdkwork.test
        tls: sdkwork.com
        mode: web+api
        web: adaptive
    packages: []
    overrides: {}

  standalone.unified-process.development:
    install:
      layout: source-tree
    expose:
      - domain: agents.local.sdkwork.test
        tls: off
        mode: web+api
        web: adaptive
    packages: []
    overrides:
      allowInsecureTls: true
