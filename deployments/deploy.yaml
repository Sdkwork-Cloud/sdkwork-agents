version: 2
defaultProfile: cloud.production

profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: agents-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: agents-admin-test.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agent-test.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agents-app-test.sdkwork.com
        tls: sdkwork.com
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900
      kubernetes:
        reference: deployments/kubernetes/

  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: agents-staging.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: agents-admin-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agent-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agents-app-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900
      kubernetes:
        reference: deployments/kubernetes/

  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: agents.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: agents-admin.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agent.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agents-app.sdkwork.com
        tls: sdkwork.com
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900
      kubernetes:
        reference: deployments/kubernetes/

  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose: []
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900
