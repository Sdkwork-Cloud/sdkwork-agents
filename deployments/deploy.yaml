version: 1
defaultProfile: cloud.production

profiles:
  cloud.production:
    install:
      layout: binary-package
    expose:
      - domain: agents.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: agents-admin.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agent.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: agents-app.sdkwork.com
        tls: sdkwork.com
        mode: api
    packages: []
    overrides:
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900

  standalone.production:
    install:
      layout: binary-package
    # The private standalone origin is operator-registered at deployment time.
    expose: []
    packages: []
    overrides:
      proxy:
        upstreams:
          application: http://127.0.0.1:8095
          platform: http://127.0.0.1:3900
