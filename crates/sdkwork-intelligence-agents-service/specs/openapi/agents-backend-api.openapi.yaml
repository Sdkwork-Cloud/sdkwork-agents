      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.activate
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.provider_binding_changed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/BindingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAgentProviderBindingRequest'
      responses:
        '200':
          description: Activated managed agent provider binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderBindingResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
