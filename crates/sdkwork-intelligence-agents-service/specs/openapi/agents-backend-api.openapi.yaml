          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.list
      x-sdkwork-tenant-scope: tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Managed agent provider binding list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderBindingListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ai]
      summary: Create a provider binding for one managed agent
      operationId: agents.providerBindings.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.add
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.provider_binding_changed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
