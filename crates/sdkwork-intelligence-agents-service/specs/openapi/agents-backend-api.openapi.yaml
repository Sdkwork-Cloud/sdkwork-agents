  /backend/v3/api/ai/agents/{agentId}/audit_events:
    get:
      tags: [ai]
      summary: List managed agent audit events
      operationId: agents.auditEvents.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.auditEvents
      x-sdkwork-permission: agent.business.audit.read
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.audit_events.listed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: Managed agent audit events response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAuditEventListResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '400':
          description: Invalid audit query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: page_size must be less than or equal to 200
                code: validation_error
                errorCategory: validation
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/provider_bindings:
    get:
      tags: [ai]
      summary: List provider bindings for one managed agent
      operationId: agents.providerBindings.list
      security:
