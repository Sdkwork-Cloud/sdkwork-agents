              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/restore:
    post:
      tags: [ai]
      summary: Restore one soft-deleted managed agent
      operationId: agents.restore
      security:
        - AuthToken: []
