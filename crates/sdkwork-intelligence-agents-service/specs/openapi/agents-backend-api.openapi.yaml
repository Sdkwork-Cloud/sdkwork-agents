      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.restore
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.restored
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreAgentRequest'
      responses:
        '200':
          description: Restored managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
