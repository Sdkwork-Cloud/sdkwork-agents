      x-sdkwork-resource: agents.compositionSlots
      x-sdkwork-permission: agent.business.composition_slot.list
      x-sdkwork-tenant-scope: tenant
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Managed agent composition slot list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompositionSlotListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ai]
      summary: Create a composition slot for one managed agent
      operationId: agents.compositionSlots.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.compositionSlots
      x-sdkwork-permission: agent.business.composition_slot.create
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.composition_slot_created
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCompositionSlotRequest'
      responses:
        '201':
          description: Created managed agent composition slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompositionSlotResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/composition_slots/{slotId}:
    get:
      tags: [ai]
      summary: Retrieve one managed agent composition slot
      operationId: agents.compositionSlots.retrieve
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.compositionSlots
      x-sdkwork-permission: agent.business.composition_slot.retrieve
      x-sdkwork-tenant-scope: tenant
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/SlotIdPath'
      responses:
        '200':
          description: Managed agent composition slot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompositionSlotResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [ai]
      summary: Update one managed agent composition slot
      operationId: agents.compositionSlots.update
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.compositionSlots
      x-sdkwork-permission: agent.business.composition_slot.update
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.composition_slot_updated
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/SlotIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentCompositionSlotRequest'
      responses:
        '200':
          description: Updated managed agent composition slot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompositionSlotResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [ai]
      summary: Delete one managed agent composition slot
      operationId: agents.compositionSlots.delete
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.compositionSlots
      x-sdkwork-permission: agent.business.composition_slot.delete
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.composition_slot_deleted
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/SlotIdPath'
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/RequestedAt'
      responses:
        '200':
          description: Deleted managed agent composition slot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompositionSlotResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      description: Tenant id in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    OrganizationId:
      name: organization_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    OwnerUserId:
      name: owner_user_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExpectedVersion:
      name: expected_version
      in: query
      required: false
      description: Optimistic concurrency version in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    RequestedAt:
      name: requested_at
      in: query
      required: true
      description: RFC3339 mutation timestamp.
      schema:
        type: string
        format: date-time
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'

    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^slot\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    AuditAction:
      name: action
      in: query
      required: false
      description: Filter by audit action.
      schema:
        $ref: '#/components/schemas/AuditAction'
    AuditFrom:
      name: from
      in: query
      required: false
      description: RFC3339 lower-bound timestamp (inclusive).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: RFC3339 upper-bound timestamp (inclusive), must be >= from.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: validation_error
                errorCategory: validation
                retryable: false
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
