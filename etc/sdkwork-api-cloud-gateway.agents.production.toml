mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "production"

[server]
bind = "0.0.0.0:8080"

[[dependencySurfaces]]
serviceId = "sdkwork-agents-app-api"
workspace = "sdkwork-agents"
sdkFamily = "sdkwork-agents-app-sdk"
apiAuthority = "sdkwork-agents-app-api"
surface = "app"
apiPrefix = "/app/v3/api/ai/agents"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_AGENTS_APPLICATION_APP_HTTP_URL"
coverage = "agents-app-api-upstream-routes"

[[dependencySurfaces]]
serviceId = "sdkwork-agents-backend-api"
workspace = "sdkwork-agents"
sdkFamily = "sdkwork-agents-backend-sdk"
apiAuthority = "sdkwork-agents-backend-api"
surface = "backend"
apiPrefix = "/backend/v3/api/ai/agents"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_AGENTS_APPLICATION_BACKEND_HTTP_URL"
coverage = "agents-backend-api-upstream-routes"

[[dependencySurfaces]]
serviceId = "sdkwork-agents-open-api"
workspace = "sdkwork-agents"
sdkFamily = "sdkwork-agents-open-sdk"
apiAuthority = "sdkwork-agents-open-api"
surface = "open"
apiPrefix = "/agent/v3/api/ai/agents"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_AGENTS_APPLICATION_OPEN_HTTP_URL"
coverage = "agents-open-api-upstream-routes"

[[upstreams]]
serviceId = "sdkwork-agents-app-api"
baseUrl = "https://agents-app.sdkwork.com"

[[upstreams]]
serviceId = "sdkwork-agents-backend-api"
baseUrl = "https://agents-admin.sdkwork.com"

[[upstreams]]
serviceId = "sdkwork-agents-open-api"
baseUrl = "https://agent.sdkwork.com"

[cors]
allowAnyOrigin = false
allowedOrigins = ["https://agents.sdkwork.com"]

[request]
maxBodyBytes = 33554432
timeoutMs = 30000

[readiness]
checkUpstreams = true
timeoutMs = 2000

[observability]
accessLogEnabled = true
auditLogEnabled = true
accessLogSampleRateBasisPoints = 10000
auditLogSampleRateBasisPoints = 10000
metricsEnabled = true
metricsPath = "/metrics"
tracingEnabled = true
redactHeaders = ["authorization", "access-token", "cookie", "x-api-key", "set-cookie"]

[diagnostics]
enabled = false
path = "/internal/gateway/diagnostics"
includePolicyInventory = true
includeRouteInventory = true

[security]
allowedHosts = ["agents.sdkwork.com", "api.sdkwork.com"]
trustedProxyCidrs = []
secureHeadersEnabled = true
maxHeaderBytes = 65536
maxHeaderCount = 128
rejectCredentialHeadersOnAnonymousAuthRoutes = true
csrfGuardEnabled = true

[security.waf]
enabled = true
mode = "enforce"
inspectQuery = true
inspectHeaders = true
inspectJsonBody = true

[traffic]
rateLimitEnabled = true
compatXRateLimitHeaders = true
globalMaxInFlight = 2048
rateLimits = []
concurrencyLimits = []

[policy]
enabled = true
dryRun = false
rules = []

[resilience]
retryEnabled = true
maxAttempts = 2
retryStatuses = [502, 503, 504]
retryBackoffMs = 100
circuitBreakerEnabled = true
failureThreshold = 5
openSeconds = 30
halfOpenMaxAttempts = 1
